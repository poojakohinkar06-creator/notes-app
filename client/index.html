<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Notes Application - create, search, edit and delete notes"
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>Notes — capture ideas, find them instantly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme (or system preference) before first paint
      // so the page never flashes the wrong colors.
      (function () {
        var theme = null;
        try {
          var stored = localStorage.getItem('notes:theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {
          /* storage unavailable */
        }
        if (!theme) {
          theme =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
